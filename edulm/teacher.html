<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EduLM Prof">
<title>EduLM — Espace Enseignant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --navy: #0B2A4A;
  --navy-deep: #061B33;
  --gold: #C9A961;
  --cream: #F5EFE0;
  --muted: #8A95A5;
  --card: #102B4D;
  --line: rgba(255,255,255,0.08);
  --good: #5EB07B;
  --warn: #E0B14A;
  --bad: #DC6B6B;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--navy-deep);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}
nav {
  position: sticky;
  top: 0; z-index: 50;
  background: rgba(6,27,51,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  color: var(--cream);
}
.brand em { font-style: italic; color: var(--gold); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.user-chip {
  font-size: 12px; color: var(--muted);
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 50px;
  display: inline-flex; align-items: center; gap: 6px;
}
.user-chip strong { color: #fff; font-weight: 500; }
.logout-btn {
  padding: 7px 12px; background: transparent;
  border: 1px solid var(--line); border-radius: 50px;
  color: var(--muted); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; cursor: pointer; font-family: inherit;
}
.logout-btn:hover { color: #fff; border-color: var(--gold); }
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 22px 80px;
}
.hello { margin-bottom: 24px; }
.eyebrow {
  font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 8px;
}
.hello h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  color: var(--cream);
}
.hello h1 em { font-style: italic; color: var(--gold); }
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.tab {
  background: transparent;
  border: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab:hover { color: #fff; }
.panel { display: none; }
.panel.active { display: block; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 18px;
}
.card h2 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 1.1rem;
  color: var(--cream);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card h2 .icon { color: var(--gold); }
.class-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.class-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.class-card:hover { transform: translateY(-2px); border-color: var(--gold); }
.class-card .name {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  color: var(--cream);
  margin-bottom: 4px;
}
.class-card .sub {
  font-size: 12px; color: var(--muted); margin-bottom: 12px;
}
.class-card .meta {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.class-card .meta strong { color: #fff; font-weight: 500; }
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 12px 10px;
  text-align: left;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}
th {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.att-btns { display: inline-flex; gap: 4px; }
.att {
  padding: 5px 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}
.att.p.on { background: rgba(94,176,123,0.2); border-color: var(--good); color: var(--good); }
.att.a.on { background: rgba(220,107,107,0.2); border-color: var(--bad); color: var(--bad); }
.att.l.on { background: rgba(224,177,74,0.2); border-color: var(--warn); color: var(--warn); }
input[type="number"], input[type="text"], textarea {
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--line);
  color: #fff;
  padding: 9px 11px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  width: 100%;
  outline: none;
}
input[type="number"]:focus, input[type="text"]:focus, textarea:focus { border-color: var(--gold); }
.field { display: block; margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  background: var(--gold);
  color: var(--navy-deep);
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
.btn:hover { transform: translateY(-1px); }
.empty {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  padding: 24px 0;
}
.flash {
  font-size: 12px;
  color: var(--good);
  margin-left: 10px;
  opacity: 0;
  transition: opacity 0.3s;
}
.flash.show { opacity: 1; }
</style>
</head>
<body>

<nav>
  <div class="brand">EduLM — <em>Enseignant</em></div>
  <div class="nav-right">
    <span class="user-chip">👤 <strong id="user-name">—</strong></span>
    <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
  </div>
</nav>

<div class="container">

  <div class="hello">
    <div class="eyebrow">Tableau de bord enseignant</div>
    <h1>Bienvenue <em id="firstname">!</em></h1>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-panel="classes">Mes classes</button>
    <button class="tab" data-panel="attendance">Présence</button>
    <button class="tab" data-panel="grades">Notes</button>
    <button class="tab" data-panel="homework">Devoirs</button>
  </div>

  <!-- CLASSES -->
  <div class="panel active" id="panel-classes">
    <div class="card">
      <h2><span class="icon">🏫</span> Mes classes</h2>
      <div class="class-grid" id="classes-grid"></div>
    </div>
  </div>

  <!-- ATTENDANCE -->
  <div class="panel" id="panel-attendance">
    <div class="card">
      <h2><span class="icon">✓</span> Feuille de présence
        <span class="flash" id="att-flash">Enregistré</span>
      </h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <select id="att-class" style="background:rgba(0,0,0,0.25);border:1px solid var(--line);color:#fff;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:13px"></select>
        <input type="text" id="att-date" placeholder="Date" style="max-width:180px" />
      </div>
      <table>
        <thead>
          <tr><th>Élève</th><th style="width:auto">Statut</th></tr>
        </thead>
        <tbody id="att-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- GRADES -->
  <div class="panel" id="panel-grades">
    <div class="card">
      <h2><span class="icon">📊</span> Saisie des notes
        <span class="flash" id="grade-flash">Enregistré</span>
      </h2>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
        <div class="field">
          <label>Classe</label>
          <select id="grade-class" style="background:rgba(0,0,0,0.25);border:1px solid var(--line);color:#fff;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:13px;width:100%"></select>
        </div>
        <div class="field">
          <label>Évaluation</label>
          <input type="text" id="grade-label" placeholder="Contrôle ch.5" />
        </div>
        <div class="field">
          <label>Sur (max)</label>
          <input type="number" id="grade-max" value="20" min="1" max="100" />
        </div>
      </div>
      <table>
        <thead><tr><th>Élève</th><th class="num" style="width:120px">Note</th></tr></thead>
        <tbody id="grade-tbody"></tbody>
      </table>
      <div style="margin-top:16px"><button class="btn" onclick="saveGrades()">💾 Enregistrer</button></div>
    </div>
  </div>

  <!-- HOMEWORK -->
  <div class="panel" id="panel-homework">
    <div class="card">
      <h2><span class="icon">📚</span> Assigner un devoir</h2>
      <div class="field">
        <label>Classe</label>
        <select id="hw-class" style="background:rgba(0,0,0,0.25);border:1px solid var(--line);color:#fff;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:13px;width:100%"></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field">
          <label>Titre</label>
          <input type="text" id="hw-title" placeholder="Ex. 12 à 18 p.45" />
        </div>
        <div class="field">
          <label>À rendre le</label>
          <input type="text" id="hw-due" placeholder="Lundi prochain" />
        </div>
      </div>
      <div class="field">
        <label>Détails</label>
        <textarea id="hw-details" rows="3" style="background:rgba(0,0,0,0.25);border:1px solid var(--line);color:#fff;padding:9px 11px;border-radius:8px;font-family:inherit;font-size:13px;width:100%" placeholder="Consignes…"></textarea>
      </div>
      <div><button class="btn" onclick="assignHomework()">📤 Assigner</button>
        <span class="flash" id="hw-flash">Assigné</span></div>
    </div>
  </div>

</div>

<script>
// ── FIREBASE CONFIG ──
const firebaseConfig = {
  apiKey:     "REPLACE_ME",
  authDomain: "REPLACE_ME",
  projectId:  "REPLACE_ME",
};

let auth = null, db = null;
try {
  if (firebaseConfig.apiKey !== "REPLACE_ME") {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db   = firebase.firestore();
  }
} catch(e) {}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function setText(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
function flash(id){const el=document.getElementById(id);if(!el)return;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1600);}

function doLogout(){
  if (auth) auth.signOut().then(function(){ window.location.href='index.html'; });
  else window.location.href='index.html';
}

// ── DEMO DATA ──
const DEMO_CLASSES = [
  { id:'2nde-A', name:'2nde A', subject:'Mathématiques', students:24, room:'B-104' },
  { id:'2nde-B', name:'2nde B', subject:'Mathématiques', students:22, room:'B-106' },
  { id:'1ere-S', name:'1ère S', subject:'Mathématiques', students:18, room:'B-204' },
];
const DEMO_STUDENTS = {
  '2nde-A': ['Aïcha Saad','Charbel Khoury','Diane Aoun','Élias Nasr','Farah Habib','Georges Daher','Hala Karam','Ibrahim Tabet'],
  '2nde-B': ['Joseph Abi','Karim Hage','Layla Mansour','Marc Saliba'],
  '1ere-S': ['Nadia Geagea','Omar Frem','Pascale Khoury','Rana Sleiman'],
};

let classes = DEMO_CLASSES;
let attendanceState = {}; // studentName -> 'p'|'a'|'l'
let gradesState = {}; // studentName -> number

// ── TABS ──
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    document.getElementById('panel-' + t.dataset.panel).classList.add('active');
  });
});

// ── RENDER CLASSES ──
function renderClasses(){
  const el = document.getElementById('classes-grid');
  if (!classes.length) { el.innerHTML = '<div class="empty">Aucune classe.</div>'; return; }
  el.innerHTML = classes.map(function(c){
    return '<div class="class-card" onclick="openClass(\'' + c.id + '\')">'
      + '<div class="name">' + escapeHtml(c.name) + '</div>'
      + '<div class="sub">' + escapeHtml(c.subject) + '</div>'
      + '<div class="meta"><span><strong>' + c.students + '</strong> élèves</span>'
      + '<span>' + escapeHtml(c.room||'') + '</span></div>'
      + '</div>';
  }).join('');
  // populate selects
  const opts = classes.map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.name)+' — '+escapeHtml(c.subject)+'</option>'; }).join('');
  ['att-class','grade-class','hw-class'].forEach(function(id){
    const sel = document.getElementById(id); if (sel) sel.innerHTML = opts;
  });
  document.getElementById('att-class').addEventListener('change', renderAttendance);
  document.getElementById('grade-class').addEventListener('change', renderGradeRoster);
  renderAttendance();
  renderGradeRoster();
}

function openClass(id){
  document.querySelector('.tab[data-panel="attendance"]').click();
  document.getElementById('att-class').value = id;
  renderAttendance();
}

// ── ATTENDANCE ──
function renderAttendance(){
  const cls = document.getElementById('att-class').value;
  const students = DEMO_STUDENTS[cls] || [];
  attendanceState = {};
  const tbody = document.getElementById('att-tbody');
  if (!students.length) { tbody.innerHTML = '<tr><td colspan="2" class="empty">Aucun élève.</td></tr>'; return; }
  tbody.innerHTML = students.map(function(s){
    const sid = s.replace(/\W+/g,'-');
    return '<tr><td>' + escapeHtml(s) + '</td>'
      + '<td><div class="att-btns">'
      + '<button class="att p" data-s="' + sid + '" data-name="' + escapeHtml(s) + '" data-v="p" onclick="markAtt(this)">Présent</button>'
      + '<button class="att l" data-s="' + sid + '" data-name="' + escapeHtml(s) + '" data-v="l" onclick="markAtt(this)">Retard</button>'
      + '<button class="att a" data-s="' + sid + '" data-name="' + escapeHtml(s) + '" data-v="a" onclick="markAtt(this)">Absent</button>'
      + '</div></td></tr>';
  }).join('');
  document.getElementById('att-date').value = new Date().toLocaleDateString('fr-FR');
}

function markAtt(btn){
  const name = btn.dataset.name;
  const v = btn.dataset.v;
  attendanceState[name] = v;
  // Toggle visual state
  btn.parentNode.querySelectorAll('.att').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  // Persist
  if (db) {
    db.collection('attendance').add({
      classId: document.getElementById('att-class').value,
      date: document.getElementById('att-date').value,
      student: name,
      status: v,
      at: firebase.firestore.FieldValue.serverTimestamp(),
    }).then(function(){ flash('att-flash'); }).catch(function(){});
  } else {
    flash('att-flash');
  }
}

// ── GRADES ──
function renderGradeRoster(){
  const cls = document.getElementById('grade-class').value;
  const students = DEMO_STUDENTS[cls] || [];
  gradesState = {};
  const tbody = document.getElementById('grade-tbody');
  if (!students.length) { tbody.innerHTML = '<tr><td colspan="2" class="empty">Aucun élève.</td></tr>'; return; }
  tbody.innerHTML = students.map(function(s){
    return '<tr><td>' + escapeHtml(s) + '</td>'
      + '<td class="num"><input type="number" data-name="' + escapeHtml(s) + '" min="0" max="100" placeholder="—" oninput="setGrade(this)" style="text-align:right;max-width:100px"/></td>'
      + '</tr>';
  }).join('');
}

function setGrade(input){
  gradesState[input.dataset.name] = parseFloat(input.value);
}

function saveGrades(){
  const cls = document.getElementById('grade-class').value;
  const label = document.getElementById('grade-label').value.trim();
  const max = parseFloat(document.getElementById('grade-max').value) || 20;
  if (!label) { alert('Indiquez le nom de l\'évaluation.'); return; }
  if (db) {
    const batch = db.batch();
    Object.keys(gradesState).forEach(function(name){
      const v = gradesState[name];
      if (isNaN(v)) return;
      const ref = db.collection('grades').doc();
      batch.set(ref, {
        classId: cls, student: name, label: label, grade: v, max: max,
        at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });
    batch.commit().then(function(){ flash('grade-flash'); }).catch(function(e){ alert(e.message); });
  } else {
    flash('grade-flash');
  }
}

// ── HOMEWORK ──
function assignHomework(){
  const cls = document.getElementById('hw-class').value;
  const title = document.getElementById('hw-title').value.trim();
  const due = document.getElementById('hw-due').value.trim();
  const details = document.getElementById('hw-details').value.trim();
  if (!title) { alert('Indiquez un titre.'); return; }
  if (db) {
    db.collection('homework').add({
      classId: cls, title: title, due: due, details: details,
      at: firebase.firestore.FieldValue.serverTimestamp(),
    }).then(function(){
      flash('hw-flash');
      document.getElementById('hw-title').value = '';
      document.getElementById('hw-due').value = '';
      document.getElementById('hw-details').value = '';
    }).catch(function(e){ alert(e.message); });
  } else {
    flash('hw-flash');
  }
}

// ── BOOT ──
function boot(user){
  const first = (user && (user.displayName || user.email) || 'Démo').split(/[@ ]/)[0];
  setText('user-name', first);
  setText('firstname', first + ' !');
  renderClasses();
}

if (auth) {
  auth.onAuthStateChanged(function(user){
    if (!user) { window.location.href='index.html'; return; }
    boot(user);
  });
} else {
  boot(null);
}
</script>
</body>
</html>
